name: anomaly-detection-pytest

on:
  push:
    paths:
      - "anomaly-detection-service/**"
      - ".github/workflows/anomaly-detection-pytest.yml"
  pull_request:
    paths:
      - "anomaly-detection-service/**"
      - ".github/workflows/anomaly-detection-pytest.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: anomaly-detection-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q
